# Insert inside the existing HTTPS server block. Change the static root if needed.
location = /golova {
    root /var/www/golova;
    try_files /index.html =404;
    add_header Cache-Control "no-store";
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
}
location = /golova/ { return 302 /golova; }
location ^~ /golova/api/ {
    proxy_pass http://127.0.0.1:8177;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 90;
    client_max_body_size 20k;
    add_header Cache-Control "no-store" always;
    access_log off;
}
